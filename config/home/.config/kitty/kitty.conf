# Kitty — terminal de secours (le terminal principal est Ghostty)
font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 10 12
background_opacity 0.92
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 1
scrollback_lines 10000
copy_on_select no
remember_window_size no
initial_window_width  110c
initial_window_height 32c
tab_bar_style powerline
tab_powerline_style round
# Raccourcis façon Windows Terminal
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
# Couleurs, police et transparence : thème actif (lien vers ~/.config/themes/actuel/gen/kitty.conf)
include theme.conf
